name: Publicar demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Atualizar a versão dos scripts para evitar cache antigo
        run: |
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" public/index.html public/app.js public/admin.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos da vitrine
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar vitrine
        id: deployment
        uses: actions/deploy-pages@v4
